plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${project.minecraft}-${project.modVersion}"
group = "com.davigj"

base {
    archivesName = project.modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Team Abnormals"
                url = "https://maven.teamabnormals.com"
            }
        }
        filter {
            includeGroup "com.teamabnormals"
        }
    }
    maven { url "https://dvs1.progwml6.com/files/maven/" }
    maven { url "https://modmaven.k-4u.nl" }
    maven { url "https://www.cursemaven.com" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

neoForge {
    version = project.neo_version

    mods {
        "${project.modId}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', project.modId)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }

        client {
            client()
        }

        server {
            server()
        }

        data {
            data()
            programArguments.addAll(
                    "--mod", project.modId,
                    "--all",
                    "--output", file("src/generated/resources/").getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath(),
                    "--existing-mod", "blueprint"
            )
        }
    }
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
}

dependencies {
    implementation("com.teamabnormals:blueprint:${project.minecraft}-${project.blueprint}")
    implementation("maven.modrinth:caverns-and-chasms:${project.caverns_and_chasms}")

    compileOnly("mezz.jei:jei-${project.minecraft}-common-api:${project.jei}")
    compileOnly("mezz.jei:jei-${project.minecraft}-neoforge-api:${project.jei}")
    runtimeOnly("mezz.jei:jei-${project.minecraft}-neoforge:${project.jei}")
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : project.modName,
                "Specification-Vendor"    : "DavigJ",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.modName,
                "Implementation-Version"  : project.modVersion,
                "Implementation-Vendor"   : "DavigJ",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : project.modId + ".mixins.json"
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}